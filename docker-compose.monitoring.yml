services:
  db:
    networks:
      default: {}
      monitoring:
        ipv4_address: 172.30.0.2

  monitoring-init:
    profiles: ["monitoring"]
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_MONITOR_PASSWORD: ${MYSQL_MONITOR_PASSWORD:?Set MYSQL_MONITOR_PASSWORD before enabling monitoring}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mysql --protocol=tcp -h db -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e
        "CREATE USER IF NOT EXISTS 'lms_monitor'@'172.30.0.12' IDENTIFIED BY '$${MYSQL_MONITOR_PASSWORD}';
        ALTER USER 'lms_monitor'@'172.30.0.12' IDENTIFIED BY '$${MYSQL_MONITOR_PASSWORD}';
        GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'lms_monitor'@'172.30.0.12';
        FLUSH PRIVILEGES;"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      default: {}
      monitoring: {}
    depends_on:
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      mysql-exporter:
        condition: service_started
      nginx-exporter:
        condition: service_started
      blackbox-exporter:
        condition: service_started

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before enabling monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    expose: ["9100"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

  cadvisor:
    profiles: ["monitoring"]
    image: ghcr.io/google/cadvisor:0.54.0
    restart: unless-stopped
    command:
      - "--disable_metrics=disk"
    expose: ["8080"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  mysql-exporter:
    profiles: ["monitoring"]
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    user: "${MYSQL_EXPORTER_UID:-1000}:${MYSQL_EXPORTER_GID:-1000}"
    command: ["--config.my-cnf=/etc/mysql-exporter/.my.cnf"]
    expose: ["9104"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - "${MYSQL_EXPORTER_CNF_PATH:?Set MYSQL_EXPORTER_CNF_PATH before enabling monitoring}:/etc/mysql-exporter/.my.cnf:ro"
    networks:
      default: {}
      monitoring:
        ipv4_address: 172.30.0.12
    depends_on:
      monitoring-init:
        condition: service_completed_successfully

  nginx-exporter:
    profiles: ["monitoring"]
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx/nginx_status"]
    expose: ["9113"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      nginx:
        condition: service_started

  blackbox-exporter:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/blackbox.yml"]
    expose: ["9115"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - ./infra/monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  monitoring:
    name: lms-demo_monitoring
    ipam:
      config:
        - subnet: 172.30.0.0/24
